<div *ngIf="alertQueue.length !== 0" class="fixed-top mx-3 rounded" style="top: 5rem; z-index: 1021;">
    <ng-container *ngFor="let alert of alertQueue; index as i">
        <div class="alert alert-dismissible {{alert.cssClass}} rounded-2 border-2 mb-0" role="alert">
            {{alert.message}}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"
                (click)="removeAlert(i)"></button>
        </div>
    </ng-container>
</div>
